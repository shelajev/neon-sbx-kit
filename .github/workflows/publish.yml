name: Publish sbx kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.version || '' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Validate kit
        run: |
          bash tests/smoke.sh
          sbx kit validate .
          sbx kit inspect .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kit to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ref="docker.io/${DOCKERHUB_USERNAME}/neon-sbx-kit:${VERSION}"
          sbx kit push . "$ref"
          echo "Published $ref" >> "$GITHUB_STEP_SUMMARY"
