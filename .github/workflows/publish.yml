name: Publish sbx kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.version || '' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install sbx
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/docker-sbx.tar.gz"
          curl -fsSL \
            https://github.com/docker/sbx-releases/releases/download/v0.39.0/DockerSandboxes-linux-amd64.tar.gz \
            -o "$archive"
          echo "2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" docker-sbx/sbx
          sudo install -m 0755 "$RUNNER_TEMP/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Validate kit
        run: |
          bash tests/smoke.sh
          sbx kit validate .
          sbx kit inspect .

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Sandboxes
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | \
            sbx login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish kit to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ref="docker.io/${DOCKERHUB_USERNAME}/neon-sbx-kit:${VERSION}"
          sbx kit push . "$ref"
          echo "Published $ref" >> "$GITHUB_STEP_SUMMARY"
