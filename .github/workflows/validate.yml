name: Validate sbx kit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install sbx
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/docker-sbx.tar.gz"
          curl -fsSL \
            https://github.com/docker/sbx-releases/releases/download/v0.39.0/DockerSandboxes-linux-amd64.tar.gz \
            -o "$archive"
          echo "2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" docker-sbx/sbx
          sudo install -m 0755 "$RUNNER_TEMP/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Validate source and scripts
        run: bash tests/smoke.sh

      - name: Pack and validate artifact
        run: |
          sbx kit pack . -o /tmp/neon-sbx-kit.zip
          sbx kit validate /tmp/neon-sbx-kit.zip
